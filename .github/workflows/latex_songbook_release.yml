name: 'LaTeX Leadsheet Songbook'

on:
  push:
    branches:
      - main
    # Keep in step with the pull_request paths in songbook_build.yml.
    paths:
      - 'leadsheets/trupe_lauda_si_inchinare/**'
      - 'LaTeX/songbook/**'
      - 'src/songToLeadsheetConverter.ts'
      - 'src/chordMarkup.ts'
      - 'src/songParser.ts'
      - '.github/workflows/songbook_build.yml'
      - '.github/workflows/latex_songbook_release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  BuildSongbook:
    uses: ./.github/workflows/songbook_build.yml

  LaTeXSongbookRelease:
    needs: BuildSongbook
    runs-on: ubuntu-24.04
    permissions:
      contents: write # publishes the GitHub release
    steps:
      - name: Get the PDF
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bes-songbook
          path: LaTeX/songbook

      - name: Generate Release Tag
        id: tag
        run: |
          release_tag="BES_Songbook_$(date +"%Y_%B_%d_%H-%M")"
          echo "release_tag=$release_tag" >> $GITHUB_OUTPUT

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: 'LaTeX/songbook/bes-songbook.pdf'
          tag_name: ${{ steps.tag.outputs.release_tag }}
          fail_on_unmatched_files: true
          draft: false
          make_latest: true
          generate_release_notes: true
          body: Release al caietului de cântece BES ale trupelor de laudă și închinare (se face incremental, după fiecare schimbare în repository). Acceseaza-l [aici](https://drive.google.com/drive/folders/1zaxtSZnHy73DaQLCCqoNCZ0lJ11ClHBR).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to GDrive
        uses: adityak74/google-drive-upload-git-action@935eccf4c2812e4d492c3d7c7ff59ca7520bf129 # main (2025-03-24, no release tag)
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS_ENCODED }}
          filename: 'LaTeX/songbook/bes-songbook.pdf'
          folderId: ${{ secrets.GDRIVE_SONGBOOKS_FOLDER_ID }} # Songbooks
          overwrite: 'true' # optional boolean
