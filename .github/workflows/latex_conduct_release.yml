name: 'LaTeX Release Conduct'

on:
  push:
    branches:
      - main
    paths:
      - 'LaTeX/conduct/**'
  workflow_dispatch:

permissions:
  contents: write # publishes the GitHub release

jobs:
  LaTeXConductRelease:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compile BES Conduct LaTeX doc
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4.1.0
        with:
          root_file: BES_Conduct_Afisaj.tex
          working_directory: LaTeX/conduct/

      - name: Generate Release Tag
        id: tag
        run: echo "release_tag=BES_Conduct_$(date +"%Y.%m.%d_%H-%M")" >> $GITHUB_OUTPUT

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: 'LaTeX/conduct/BES_Conduct_Afisaj.pdf'
          tag_name: ${{ steps.tag.outputs.release_tag }}
          fail_on_unmatched_files: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to GDrive
        uses: adityak74/google-drive-upload-git-action@935eccf4c2812e4d492c3d7c7ff59ca7520bf129 # main (2025-03-24, no release tag)
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS_ENCODED }}
          filename: 'LaTeX/conduct/BES_Conduct_Afisaj.pdf'
          folderId: ${{ secrets.GDRIVE_SONGBOOKS_FOLDER_ID }} # Songbooks
          overwrite: 'true' # optional boolean
