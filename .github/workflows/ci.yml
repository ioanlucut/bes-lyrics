name: 'CI & Auto Scripts'

on: [ pull_request ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  Build:
    runs-on: ubuntu-24.04
    steps:
      # Checks out the pull request merged into its base, which also works for
      # pull requests from forks.
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:ci
        env:
          CI: true
          FORCE_COLOR: 2

  AutoUpdateMeta:
    needs: [ Build ]
    # The workflow token cannot push to a fork; a maintainer runs
    # `npm run meta:ci` for those pull requests instead.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm ci

      - name: Update meta (hashes, renames, etc.)
        run: |
          npm run meta:ci
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit --cleanup=verbatim -am "[Bot] I have added all of the meta information about the content to it.
          >
          >
          request-checks: true"
        env:
          CI: true
          FORCE_COLOR: 2

      # Only this step sees the token, so `npm ci` and the scripts above
      # cannot read it.
      - name: Push meta changes
        run: git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${HEAD_REF}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
